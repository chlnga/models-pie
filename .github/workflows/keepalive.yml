name: Keep-alive

# GitHub auto-disables scheduled workflows after 60 days without repo
# activity (commits — workflow runs don't count). This checks weekly and
# pushes an empty bump commit as github-actions[bot] only when the repo has
# been dormant for 45+ days. The 45-day threshold with weekly checks leaves
# room for a couple of missed runs before the 60-day cliff. Silent during
# normal development.

on:
  schedule:
    # Weekly, Mondays 02:37 UTC — off-peak, off-minute.
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump if dormant
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was $age_days day(s) ago."
          if [ "$age_days" -lt 45 ]; then
            echo "Repo is active — nothing to do."
            exit 0
          fi
          git config user.name "models-pie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore: keep-alive bump (prevents scheduled-workflow auto-disable)"
          git push
