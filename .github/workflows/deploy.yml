name: Deploy to Cloudflare

# Only CI/CD path (no Cloudflare Git integration): build + wrangler deploy of
# Worker static assets (wrangler.jsonc), serving modelspie.com + workers.dev.
# Push = code deploys; daily schedule = data refresh. Secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - main
  schedule:
    # 04:23 UTC daily — off-peak to avoid GitHub's top-of-hour cron congestion.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Data JSONs are gitignored, so every run fetches fresh.
      - name: Fetch and compile data
        run: npm run setup

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
